repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff
        entry: poetry run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: poetry run mypy --package timberborn_power_mix
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: poetry run pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: profile-sim
        name: profile
        entry: poetry run scalene run scripts/profile_sim.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: profile-opt
        name: profile
        entry: poetry run scalene run scripts/profile_opt.py
        language: system
        pass_filenames: false
        stages: [manual]
