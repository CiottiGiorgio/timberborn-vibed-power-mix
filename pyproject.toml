[project]
name = "timberborn-vibed-power-mix"
version = "0.1.0"
description = ""
authors = [
    {name = "CiottiGiorgio"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.1",
    "pydantic>=2.0.0",
    "click>=8.1.7",
    "numba>=0.61.0",
]

[tool.poetry]
packages = [{include = "timberborn_power_mix"}]

[project.scripts]
tb-power-mix = "timberborn_power_mix.cli:cli"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
pytest = "*"
mypy = "*"
scalene = "^2.1.3"
pre-commit = "^4.1.0"
poethepoet = "^0.32.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true
exclude = [
    'timberborn_power_mix/models\.py$',
    'timberborn_power_mix/simulation/models\.py$',
    'timberborn_power_mix/optimization/models\.py$'
]

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "timberborn_power_mix.models",
    "timberborn_power_mix.simulation.models",
    "timberborn_power_mix.optimization.models"
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check . --fix"
typecheck = "mypy --package timberborn_power_mix"
test = "pytest"
profile = "scalene scripts/profile_opt.py"
all = ["format", "lint", "typecheck", "test"]
