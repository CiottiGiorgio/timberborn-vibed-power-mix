[project]
name = "timberborn-vibed-power-mix"
version = "0.1.0"
description = ""
authors = [
    {name = "CiottiGiorgio"}
]
license = {text = "MIT"}
readme = "README.md"

[tool.poetry]
packages = [
    {include = "timberborn_power_mix"},
    {include = "timberborn_power_mix_gui"}
]

[tool.poetry.dependencies]
python = "^3.13"
matplotlib = "^3.10.8"
numpy = "^2.2.4"
pydantic = "^2.12.5"
click = "^8.3.1"
numba = "^0.64.0"
pymoo = "^0.6.1"
streamlit = "^1.42.0"

[project.scripts]
tb-power-mix = "timberborn_power_mix.cli:cli"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
pytest = "*"
mypy = "*"
scalene = "^2"
pre-commit = "^4.5.1"
poethepoet = "^0.32.2"
pip-audit = "^2.10.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
exclude = [
    'timberborn_power_mix/models\.py$',
    'timberborn_power_mix/simulation/models\.py$',
    'timberborn_power_mix/optimization/models\.py$'
]

[[tool.mypy.overrides]]
module = [
    "timberborn_power_mix.models",
    "timberborn_power_mix.simulation.models",
    "timberborn_power_mix.optimization.models"
]
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check . --fix"
typecheck = "mypy --package timberborn_power_mix"
test = "pytest"
audit = "pip-audit"
gui = "streamlit run timberborn_power_mix_gui/main.py"

# Internal tasks for profiling
_run-profile-sim = "scalene run -o profiling/profile_sim.json scripts/profile_sim.py"
_view-profile-sim = "scalene view profiling/profile_sim.json"
_run-profile-opt = "scalene run -o profiling/profile_opt.json scripts/profile_opt.py"
_view-profile-opt = "scalene view profiling/profile_opt.json"

# Public sequence tasks
profile-sim = ["_run-profile-sim", "_view-profile-sim"]
profile-opt = ["_run-profile-opt", "_view-profile-opt"]

all = ["format", "lint", "typecheck", "test"]
